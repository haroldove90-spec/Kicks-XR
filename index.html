        }

    <script>
      window.__kicksxrDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__kicksxrDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('kicksxr-install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__kicksxrDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('kicksxr-app-installed'));
      });
    </script>
